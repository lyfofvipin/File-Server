{% extends "layout.html" %}
{% block content %}
<div class="content-section docs-page">
    <div class="docs-header">
        <h1>About &amp; API documentation</h1>
        <p>Overview, configuration, and API reference for this file server.</p>
    </div>
    {% if html %}
    <div class="docs-content">
        {{ html | safe }}
    </div>
    {% else %}
    <p class="docs-empty">About content is loaded from <code>README.md</code> at the repository root.</p>
    {% endif %}
</div>
{% endblock %}
