<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      try {
        document.documentElement.setAttribute(
          "data-theme",
          localStorage.getItem("fs_theme") === "light" ? "light" : "dark"
        );
      } catch (e) {}
    </script>
    <meta name="color-scheme" content="dark light" />
    <title>file-server · account</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body data-page="account">
    <div class="app" id="app-shell"></div>
    <div id="page-body" hidden>
      <div class="panel">
        <h1>account</h1>
        <p class="subtitle">Signed-in with an API key. Create extra keys for CLI / automation.</p>
        <div id="alert" class="alert" hidden></div>
        <form id="account-form" class="form">
          <label>username <input id="username" type="text" required /></label>
          <label>email <input id="email" type="email" required /></label>
          <button type="submit">./save</button>
        </form>
        <h1 style="margin-top:1.5rem">password</h1>
        <form id="password-form" class="form">
          <label>old password <input id="old-password" type="password" required /></label>
          <label>new password <input id="new-password" type="password" required /></label>
          <button type="submit">./passwd</button>
        </form>
        <div id="api-keys-section" style="margin-top:1.5rem">
          <h1>API keys</h1>
          <p class="subtitle">Keys authenticate as Bearer tokens. The secret is shown only once.</p>
          <form id="api-key-form" class="form" style="max-width:460px">
            <label>name <input id="api-key-name" type="text" placeholder="ci / laptop" /></label>
            <button type="submit" class="btn">./create-key</button>
          </form>
          <pre id="api-key-once" class="md-code" hidden style="margin-top:0.75rem;white-space:pre-wrap"></pre>
          <table class="entry-table" style="margin-top:1rem">
            <thead><tr><th>name</th><th>prefix</th><th>created</th><th>last used</th><th></th></tr></thead>
            <tbody id="api-key-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
    <script src="config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
